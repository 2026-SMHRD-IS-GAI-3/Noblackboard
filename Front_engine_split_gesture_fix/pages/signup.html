<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AirNote - 회원가입</title>
    <link rel="stylesheet" href="../css/styles.css?v=airnote-text-fix" />
  </head>
  <body class="signup-bg">
    <main class="auth-shell signup-screen">
      <section class="signup-brand">
        <div class="logo-mark">
          <span class="logo-ring"></span>
          <span class="logo-ring inner"></span>
          <span class="logo-dot"></span>
          <span class="logo-leaf"></span>
        </div>
        <p class="assistant-pill"><span></span> VISIONARY AI ASSISTANT</p>
        <h1>AirNote로<br /><span>발표 흐름을</span><br />이어가세요</h1>
        <ul>
          <li><span>✓</span> 별도 장비 없이 손동작으로 시작</li>
          <li><span>✓</span> AI 제스처 기반 포인터 지원</li>
          <li><span>✓</span> 발표 기록 저장 및 관리</li>
        </ul>
      </section>

      <section class="signup-form">
        <p class="eyebrow">SIGN UP</p>
        <h2>새 계정을 만들고<br />AirNote를 시작하세요</h2>
        <p>회원가입을 위해 다음 정보를 입력해주세요.</p>
        <form id="signupForm">
          <label>이름</label>
          <input class="input-like" id="signupName" type="text" placeholder="이름을 입력하세요" />
          <label>이메일</label>
          <input class="input-like" id="signupEmail" type="email" placeholder="airnote@example.com" />
          <label>비밀번호</label>
          <input class="input-like" id="signupPassword" type="password" placeholder="8자 이상 입력하세요" />
          <label class="terms terms-check"><input id="termsAgree" type="checkbox" /> 이용약관 및 개인정보 처리방침에 동의합니다.</label>
          <p id="termsMessage" class="form-message" role="alert"></p>
          <button class="primary-button" type="submit">회원가입</button>
        </form>
        <a class="muted-link" href="../index.html">이미 계정이 있나요? 로그인</a>
      </section>
    </main>
    <script type="module" src="../js/pages/signup.js"></script>
  </body>
</html>
